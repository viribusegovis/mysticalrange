# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft 26.1.2 runs on Java 25, so the mod must be compiled with a Java 25 toolchain (a Java 21
# compiler cannot even read 26.1's class files). Prism Launcher already downloaded a Java 25 JDK for
# this pack; point Gradle's toolchain detection at it so it does not try to fetch its own.
org.gradle.java.installations.paths=C:/Users/ViribusEgoVis/AppData/Roaming/PrismLauncher/java/java-runtime-epsilon

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.100

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=mysticalrange
# The human-readable display name for the mod.
mod_name=Mystical Range
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=com.mysticalrange

# Modrinth project this mod publishes to (see the modrinth block in build.gradle).
modrinth_project_id=o7uML6LB

# The Mystical Agriculture and Cucumber (its library mod) jars this mod compiles against, kept in
# libs/. Copied from the pack so the classes we reference match exactly what runs in game.
mysticalagriculture_jar=MysticalAgriculture-26.1.2-9.0.9.jar
cucumber_jar=Cucumber-26.1.2-9.0.6.jar
